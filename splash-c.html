<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash C — Kim Khâu Đứng</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Segoe UI', sans-serif; }
  #splash {
    position: fixed; inset: 0; background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2.5rem; cursor: pointer; user-select: none;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease 0.4s;
  }
  #splash.exit { transform: translateY(-100%); opacity: 0; }
  #splash::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 55% 45% at 50% 42%, rgba(34,197,94,0.09) 0%, transparent 70%);
  }

  .sp-ring-svg { width: 260px; height: 260px; overflow: visible; }

  /* Hexagon ring draws */
  #sp-hex {
    stroke-dasharray: 720; stroke-dashoffset: 720;
    animation: sp-draw 2.2s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
  }
  #sp-hex-inner {
    stroke-dasharray: 480; stroke-dashoffset: 480;
    animation: sp-draw 1.6s ease-out 1.8s forwards;
  }

  /* Needle descends from top */
  #sp-needle-v {
    opacity: 0;
    transform: translateY(-30px);
    animation: sp-needle-appear 0.5s ease 0.5s forwards;
  }
  @keyframes sp-needle-appear { to { opacity: 1; transform: translateY(0); } }

  /* Needle stitches up/down */
  #sp-needle-v {
    animation: sp-needle-appear 0.5s ease 0.5s forwards,
               sp-stitch-v 0.65s ease-in-out 2.6s infinite;
  }
  @keyframes sp-stitch-v {
    0%, 35%, 100% { transform: translateY(0); }
    50%, 85%      { transform: translateY(-22px); }
  }

  /* Needle glow light */
  #sp-nlight {
    animation: sp-light-v 0.65s ease-in-out 2.6s infinite;
  }
  @keyframes sp-light-v {
    0%, 35%, 100% { opacity: 0.12; }
    50%, 85%      { opacity: 0.55; }
  }

  /* Horizontal thread line draws L→R */
  #sp-hthread {
    stroke-dasharray: 200; stroke-dashoffset: 200;
    animation: sp-draw 1.8s ease 1.2s forwards;
  }

  /* Spool left side */
  #sp-spool-left { opacity: 0; animation: sp-fade 0.8s ease 2s forwards; }
  #sp-sl-lines { transform-origin: 62px 130px; animation: sp-spin 3.5s linear 2s infinite; }

  /* Spool right side */
  #sp-spool-right { opacity: 0; animation: sp-fade 0.8s ease 2.2s forwards; }
  #sp-sr-lines { transform-origin: 198px 130px; animation: sp-spin 4s linear 2.2s infinite reverse; }

  /* Fabric */
  #sp-fabric-c { opacity: 0; animation: sp-fade 0.6s ease 2.4s forwards; }

  /* Stitch row marches */
  #sp-stitch-c {
    opacity: 0;
    animation: sp-fade 0.5s ease 2.6s forwards, sp-march 0.65s linear 2.6s infinite;
  }

  @keyframes sp-draw  { to { stroke-dashoffset: 0; } }
  @keyframes sp-fade  { to { opacity: 1; } }
  @keyframes sp-spin  { to { transform: rotate(360deg); } }
  @keyframes sp-march { to { stroke-dashoffset: -16; } }
  @keyframes sp-up    { to { opacity: 1; transform: translateY(0); } }
  @keyframes sp-blink { 0%,100% { opacity:.3; } 50% { opacity:1; } }

  .sp-brand {
    text-align: center; opacity: 0; transform: translateY(14px);
    animation: sp-up 1s ease 2.6s forwards;
  }
  .sp-brand-name {
    font-size: 2rem; font-weight: 800; letter-spacing: -0.03em;
    color: #fff; text-shadow: 0 0 28px rgba(255,255,255,0.28);
  }
  .sp-brand-sub {
    font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.16em; color: #444; margin-top: 5px;
  }
  .sp-welcome {
    text-align: center; max-width: 280px; padding: 0 1rem;
    opacity: 0; transform: translateY(10px);
    animation: sp-up 1s ease 3.1s forwards;
  }
  .sp-welcome-text {
    font-size: 0.88rem; font-style: italic; color: #606060; line-height: 1.6; text-align: center;
  }
  .sp-tap {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: #333; opacity: 0;
    animation: sp-fade 1s ease 4.2s forwards, sp-blink 2.2s ease-in-out 5.2s infinite;
  }
</style>
</head>
<body>
<div id="splash">
  <svg class="sp-ring-svg" viewBox="0 0 260 260" fill="none">

    <!-- Hexagon outer -->
    <polygon points="130,18 224,70 224,190 130,242 36,190 36,70"
      stroke="#161616" stroke-width="1.5" fill="none"/>
    <polygon id="sp-hex"
      points="130,18 224,70 224,190 130,242 36,190 36,70"
      stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="18 8" fill="none"/>

    <!-- Hexagon inner -->
    <polygon id="sp-hex-inner"
      points="130,52 196,90 196,170 130,208 64,170 64,90"
      stroke="#1c3a28" stroke-width="1.5" stroke-dasharray="8 10"
      stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Horizontal thread from left spool to right spool -->
    <line id="sp-hthread" x1="86" y1="130" x2="174" y2="130"
      stroke="#22c55e" stroke-width="1" opacity="0.4" stroke-linecap="round"/>

    <!-- Left spool -->
    <g id="sp-spool-left">
      <ellipse cx="62" cy="124" rx="18" ry="8" fill="#181818" stroke="#282828" stroke-width="1.2"/>
      <rect x="44" y="124" width="36" height="12" fill="#181818"/>
      <ellipse cx="62" cy="136" rx="18" ry="8" fill="#181818" stroke="#282828" stroke-width="1.2"/>
      <g id="sp-sl-lines">
        <ellipse cx="62" cy="130" rx="14" ry="6" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
        <line x1="48" y1="130" x2="76" y2="130" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
      </g>
    </g>

    <!-- Right spool -->
    <g id="sp-spool-right">
      <ellipse cx="198" cy="124" rx="18" ry="8" fill="#181818" stroke="#282828" stroke-width="1.2"/>
      <rect x="180" y="124" width="36" height="12" fill="#181818"/>
      <ellipse cx="198" cy="136" rx="18" ry="8" fill="#181818" stroke="#282828" stroke-width="1.2"/>
      <g id="sp-sr-lines">
        <ellipse cx="198" cy="130" rx="14" ry="6" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
        <line x1="184" y1="130" x2="212" y2="130" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
      </g>
    </g>

    <!-- Fabric strip centre -->
    <g id="sp-fabric-c">
      <rect x="88" y="148" width="84" height="18" rx="3" fill="#181818" stroke="#252525" stroke-width="1"/>
      <rect x="88" y="152" width="84" height="10" rx="2" fill="#1a1a1a"/>
    </g>

    <!-- Marching stitch -->
    <line id="sp-stitch-c" x1="94" y1="157" x2="176" y2="157"
      stroke="#22c55e" stroke-width="1.4" stroke-dasharray="5 5" stroke-linecap="round"/>

    <!-- Needle (vertical, centred) -->
    <g id="sp-needle-v">
      <!-- Glow under needle tip -->
      <ellipse id="sp-nlight" cx="130" cy="152" rx="14" ry="5" fill="#22c55e" opacity="0.12"/>
      <!-- Needle body -->
      <rect x="127" y="88" width="6" height="64" rx="3" fill="#c8c8c8"/>
      <!-- Needle top cap -->
      <ellipse cx="130" cy="88" rx="3" ry="4" fill="#a0a0a0"/>
      <!-- Thread hole -->
      <ellipse cx="130" cy="96" rx="1.5" ry="2.5" fill="none" stroke="#22c55e" stroke-width="1.2"/>
      <!-- Thread through hole -->
      <line x1="130" y1="96" x2="130" y2="130" stroke="#22c55e" stroke-width="0.8" opacity="0.6" stroke-dasharray="3 2"/>
      <!-- Needle tip -->
      <path d="M127,152 L130,162 L133,152 Z" fill="#b0b0b0"/>
    </g>

  </svg>

  <div class="sp-brand">
    <div class="sp-brand-name">YoungStory</div>
    <div class="sp-brand-sub">Bảng báo cáo sản xuất</div>
  </div>
  <div class="sp-welcome">
    <div class="sp-welcome-text">Mỗi đường chỉ là một nỗ lực, mỗi sản phẩm là niềm tự hào.</div>
  </div>
  <div class="sp-tap">Chạm để bắt đầu</div>
</div>
<script>
  document.getElementById('splash').addEventListener('click', function() {
    this.classList.add('exit');
  });
</script>
</body>
</html>
